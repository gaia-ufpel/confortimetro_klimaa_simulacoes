[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ambiens"
version = "0.9.0"
description = "Simulações de conforto térmico com EnergyPlus"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
ambiens = "cli:main"
confortimetro = "cli:main"

[tool.setuptools]
packages = ["confortimetro"]

# A fonte de ícones é lida do disco em tempo de execução (gui/theme.icon).
[tool.setuptools.package-data]
confortimetro = ["gui/assets/*", "drive/client_secret.json", "etiquetagem/*.csv"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
