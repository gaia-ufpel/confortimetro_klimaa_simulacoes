name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Empacotar (PyInstaller)
        run: pyinstaller packaging/confortimetro.spec --noconfirm

      - name: Gerar instalador (Inno Setup)
        run: iscc packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ConfortimetroKlimaa-setup
          path: dist/ConfortimetroKlimaa-*-setup.exe

      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ConfortimetroKlimaa-*-setup.exe
