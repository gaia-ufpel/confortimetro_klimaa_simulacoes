name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # criar a release e anexar o instalador

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Definir a versão
        shell: pwsh
        run: |
          $projeto = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $versao = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($versao -ne $projeto) {
              throw "Tag v$versao diverge da version do pyproject.toml ($projeto). Alinhe as duas antes de publicar."
            }
          } else {
            $versao = "$projeto-dev+$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "VERSAO=$versao" >> $env:GITHUB_ENV
          echo "Versão do build: $versao"

      - name: Empacotar (PyInstaller)
        run: pyinstaller packaging/confortimetro.spec --noconfirm

      - name: Gerar instalador (Inno Setup)
        run: iscc /DAppVersion=$env:VERSAO packaging\installer.iss
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ConfortimetroKlimaa-setup
          path: dist/ConfortimetroKlimaa-*-setup.exe

      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ConfortimetroKlimaa-*-setup.exe
          generate_release_notes: true
